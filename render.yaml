services:
  - type: web
    name: anscor-ai
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: TF_ENABLE_ONEDNN_OPTS
        value: "0"
    healthCheckPath: /
