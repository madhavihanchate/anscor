<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - ANISOR</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="upload-page">

    <!-- NAVBAR -->

    <div class="navbar">

        <h2>ANISOR</h2>

        <button onclick="goHome()">Home</button>

    </div>


    <!-- PROFILE SECTION -->

    <div class="section" style="margin-top:40px;">

        <h2>Patient Profile</h2>

        <div class="profile-info">

            <p><b>Patient ID:</b> <span id="pid"></span></p>
            <p><b>Name:</b> <span id="name"></span></p>
            <p><b>Email:</b> <span id="email"></span></p>
            <p><b>Phone:</b> <span id="phone"></span></p>
            <p><b>Sex:</b> <span id="sex"></span></p>
            <p><b>Date of Birth:</b> <span id="dob"></span></p>
            <p><b>Age:</b> <span id="age"></span></p>
            <p><b>Blood Group:</b> <span id="blood"></span></p>
            <p><b>Country:</b> <span id="country"></span></p>

        </div>

    </div>


    <!-- PAST RECORDS SECTION -->

    <div class="section">

        <h2>Past Diagnosis Records</h2>

        <div id="recordsContainer">

            <p class="no-records">Loading records...</p>

        </div>

    </div>

    <script src="script.js"></script>

    <script>
        // Load profile and records on page load
        loadProfile();
    </script>

</body>

</html>
